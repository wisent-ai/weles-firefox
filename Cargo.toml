[package]
name = "weles-firefox"
version = "0.1.0"
edition = "2021"
publish = false
description = "Package an existing Apple-signed Firefox build as a Weles browser candidate"
repository = "https://github.com/wisent-ai/weles-firefox"

[[bin]]
name = "weles-firefox"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
hex = "0.4"
plist = "1"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
